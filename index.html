<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPYing — Intelligence Operations</title>
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
>

<style>
:root {
    --bg: #080d12;
    --panel: #101820;
    --panel2: #151f28;
    --green: #8fb89a;
    --green2: #b4d4bc;
    --blue: #8ca9c7;
    --text: #e8edf1;
    --muted: #8795a1;
    --border: #27343e;
    --danger: #d77f7f;
    --warning: #d8b66d;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 14px;
}

button, input, textarea, select {
    font: inherit;
}

button {
    cursor: pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 3px;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    background: #080e14;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 5px;
}

textarea {
    resize: vertical;
    min-height: 85px;
}

label {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 7px;
}

h1, h2, h3, p {
    margin-top: 0;
}

h1 {
    font-size: 26px;
    letter-spacing: 2px;
}

h2 {
    font-size: 20px;
}

h3 {
    font-size: 14px;
}

p {
    line-height: 1.6;
}

small {
    color: var(--muted);
}

button {
    color: var(--text);
}

.primary {
    background: var(--green);
    color: #101710;
    border: 1px solid var(--green);
    padding: 12px 16px;
    border-radius: 4px;
    font-weight: 700;
}

.primary:hover {
    background: var(--green2);
}

.secondary {
    background: transparent;
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 4px;
}

.secondary:hover {
    border-color: var(--green);
}

.danger {
    color: var(--danger);
}

.muted {
    color: var(--muted);
}

.green {
    color: var(--green);
}

.blue {
    color: var(--blue);
}

.hidden {
    display: none !important;
}

.tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--green);
}

.divider {
    height: 1px;
    background: var(--border);
    margin: 18px 0;
}

.card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px;
    min-width: 0;
}

.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
}

.card-header h2,
.card-header h3 {
    margin: 0;
}

.grid {
    display: grid;
    gap: 18px;
}

.grid.two {
    grid-template-columns: repeat(2, minmax(0, 1fr));
}

.grid.three {
    grid-template-columns: repeat(3, minmax(0, 1fr));
}

.field {
    margin-bottom: 16px;
}

.row {
    display: flex;
    align-items: center;
    gap: 10px;
}

.between {
    justify-content: space-between;
}

.status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
}

.status-dot.yellow {
    background: var(--warning);
}

.status-dot.red {
    background: var(--danger);
}

.status-dot.gray {
    background: #69747d;
}

#loginScreen {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
        radial-gradient(ellipse at 50% 0%, #1a2a32 0%, transparent 65%),
        var(--bg);
}

.login-box {
    width: min(440px, 100%);
    padding: 35px;
    background: rgba(16, 24, 32, .95);
    border: 1px solid var(--border);
    border-radius: 7px;
    box-shadow: 0 25px 80px #0008;
}

.login-logo {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: 8px;
    color: var(--green);
    margin: 15px 0 8px;
}

.login-subtitle {
    color: var(--muted);
    letter-spacing: 3px;
    font-size: 10px;
}

.login-status {
    color: var(--green);
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

.login-box .primary {
    width: 100%;
    margin-top: 5px;
}

.login-switch {
    width: 100%;
    margin-top: 15px;
    border: 0;
    background: none;
    color: var(--blue);
}

.login-message {
    color: var(--danger);
    margin-top: 15px;
    font-size: 12px;
}

.demo-note {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
    margin-top: 25px;
    border-top: 1px solid var(--border);
    padding-top: 15px;
}

#app {
    display: none;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 235px;
    background: #0c131a;
    border-right: 1px solid var(--border);
    padding: 25px 14px;
    z-index: 20;
    display: flex;
    flex-direction: column;
}

.brand {
    padding: 0 12px 30px;
}

.brand strong {
    color: var(--green);
    font-size: 24px;
    letter-spacing: 4px;
}

.brand small {
    display: block;
    margin-top: 7px;
    font-size: 9px;
    letter-spacing: 2px;
}

.nav-label {
    color: #62717d;
    font-size: 9px;
    letter-spacing: 2px;
    padding: 0 12px;
    margin: 10px 0;
}

.nav-button {
    width: 100%;
    background: transparent;
    border: 1px solid transparent;
    color: #a4b0b9;
    text-align: left;
    padding: 12px;
    border-radius: 4px;
    margin-bottom: 4px;
}

.nav-button:hover,
.nav-button.active {
    background: #17231f;
    color: var(--green);
    border-color: #2a4134;
}

.nav-icon {
    display: inline-block;
    width: 28px;
    color: var(--green);
}

.sidebar-bottom {
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding: 20px 10px 0;
}

.agent-mini {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 38px;
    height: 38px;
    border-radius: 4px;
    display: grid;
    place-items: center;
    background: #1e3027;
    color: var(--green);
    font-weight: bold;
    border: 1px solid #344b3b;
}

.agent-mini strong {
    display: block;
    font-size: 12px;
}

.agent-mini small {
    font-size: 10px;
}

.main {
    margin-left: 235px;
    min-height: 100vh;
}

.topbar {
    height: 75px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    background: #0c131a;
}

.topbar-title {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
}

.topbar-right {
    display: flex;
    align-items: center;
    gap: 18px;
}

.online {
    color: var(--green);
    font-size: 11px;
}

.content {
    padding: 30px;
    max-width: 1500px;
    margin: auto;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.page-heading {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 25px;
}

.page-heading h1 {
    margin-bottom: 8px;
}

.page-heading p {
    color: var(--muted);
    margin: 0;
}

.stat-number {
    font-size: 32px;
    font-weight: 600;
    margin: 15px 0 5px;
}

.stat-label {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1px;
}

.mission-feature {
    background:
        linear-gradient(110deg, #15251e, #101820 70%);
    border: 1px solid #304538;
}

.mission-feature h2 {
    font-size: 24px;
}

.progress {
    height: 5px;
    background: #26332d;
    border-radius: 5px;
    overflow: hidden;
    margin: 18px 0 8px;
}

.progress span {
    display: block;
    height: 100%;
    background: var(--green);
    width: 40%;
}

.list {
    display: flex;
    flex-direction: column;
}

.list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
}

.list-item:last-child {
    border-bottom: 0;
}

.list-item strong {
    display: block;
    font-size: 13px;
    margin-bottom: 5px;
}

.list-item small {
    font-size: 11px;
}

.map-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 18px;
}

.map-canvas {
    min-height: 420px;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 5px;
    background-color: #101a21;
    background-image:
        linear-gradient(#25333d44 1px, transparent 1px),
        linear-gradient(90deg, #25333d44 1px, transparent 1px);
    background-size: 42px 42px;
}

.map-canvas::before,
.map-canvas::after {
    content: "";
    position: absolute;
    width: 150%;
    height: 1px;
    background: #42515a55;
    left: -20%;
    top: 50%;
    transform: rotate(-24deg);
}

.map-canvas::after {
    transform: rotate(35deg);
    top: 35%;
}

.map-road {
    position: absolute;
    width: 150%;
    height: 15px;
    border-top: 1px solid #45545c;
    border-bottom: 1px solid #45545c;
    opacity: .4;
    transform: rotate(45deg);
    left: -20%;
    top: 65%;
}

.map-pin {
    position: absolute;
    z-index: 2;
    background: #1d3027;
    border: 1px solid var(--green);
    color: var(--green);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 10px;
    cursor: pointer;
}

.map-pin.team {
    background: #1b2936;
    border-color: var(--blue);
    color: var(--blue);
}

.map-pin.me {
    left: 50%;
    top: 50%;
}

.map-pin.team1 {
    left: 22%;
    top: 28%;
}

.map-pin.team2 {
    right: 18%;
    top: 65%;
}

.map-pin.meeting {
    right: 12%;
    top: 20%;
    border-color: var(--warning);
    color: var(--warning);
    background: #30291b;
}

.map-legend {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-top: 15px;
    font-size: 11px;
    color: var(--muted);
}

.map-legend span {
    display: flex;
    align-items: center;
    gap: 7px;
}

.legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
}

.legend-dot.blue {
    background: var(--blue);
}

.legend-dot.yellow {
    background: var(--warning);
}

.checkin-status {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

.checkin-choice {
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 4px;
    background: #0b1218;
    text-align: left;
}

.checkin-choice.selected {
    border-color: var(--green);
    background: #1a2b21;
}

.checkin-choice strong {
    display: block;
    margin-bottom: 5px;
}

.checkin-choice small {
    font-size: 10px;
}

.chat-box {
    border: 1px solid var(--border);
    background: #0a1117;
    min-height: 280px;
    max-height: 450px;
    overflow-y: auto;
    padding: 18px;
    margin-bottom: 12px;
}

.message {
    max-width: 80%;
    background: #1a2935;
    border: 1px solid #2b3c49;
    padding: 12px;
    border-radius: 5px;
    margin-bottom: 12px;
}

.message.outgoing {
    margin-left: auto;
    background: #1b3025;
    border-color: #304b39;
}

.message strong {
    display: block;
    font-size: 11px;
    margin-bottom: 7px;
    color: var(--green);
}

.message p {
    margin: 0;
    overflow-wrap: anywhere;
}

.message small {
    display: block;
    text-align: right;
    margin-top: 7px;
}

.chat-compose {
    display: flex;
    gap: 10px;
}

.chat-compose input,
.chat-compose textarea {
    flex: 1;
    resize: vertical;
    min-width: 0;
}

.file-item {
    display: flex;
    gap: 15px;
    align-items: center;
    padding: 15px;
    background: #0c131a;
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 10px;
}

.file-icon {
    font-size: 22px;
    color: var(--green);
}

.file-item strong {
    display: block;
    margin-bottom: 5px;
}

.empty {
    text-align: center;
    color: var(--muted);
    padding: 35px 10px;
}

.modal {
    position: fixed;
    inset: 0;
    background: #000b;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal.open {
    display: flex;
}

.modal-box {
    width: min(650px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 25px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.modal-header h2 {
    margin: 0;
}

.close {
    background: transparent;
    border: 1px solid var(--border);
    padding: 7px 12px;
}

.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

.mobile-nav {
    display: none;
}

@media (max-width: 950px) {
    .sidebar {
        width: 190px;
    }

    .main {
        margin-left: 190px;
    }

    .content {
        padding: 20px;
    }

    .grid.three {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .map-layout {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 650px) {
    .sidebar {
        display: none;
    }

    .main {
        margin-left: 0;
    }

    .topbar {
        height: 60px;
        padding: 0 16px;
    }

    .content {
        padding: 18px 14px 95px;
    }

    .grid.two,
    .grid.three {
        grid-template-columns: 1fr;
    }

    .page-heading {
        flex-direction: column;
    }

    .page-heading h1 {
        font-size: 22px;
    }

    .mobile-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #0c131a;
        border-top: 1px solid var(--border);
        z-index: 30;
        justify-content: space-around;
        padding: 8px 2px calc(8px + env(safe-area-inset-bottom));
    }

    .mobile-nav button {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 10px;
        padding: 7px 4px;
    }

    .mobile-nav button.active {
        color: var(--green);
    }

    .mobile-nav span {
        display: block;
        font-size: 18px;
        margin-bottom: 3px;
    }

    .topbar-title {
        font-size: 9px;
    }

    .login-box {
        padding: 25px;
    }

    .login-logo {
        font-size: 32px;
    }

    .checkin-status {
        grid-template-columns: 1fr;
    }

    .stat-number {
        font-size: 26px;
    }
}

/* Real interactive map */
#mapCanvas {
    min-height: 430px;
    height: min(62vh, 650px);
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: #101a21;
}
.map-load-fallback { min-height: 300px; display:grid; place-content:center; text-align:center; padding:24px; color:#b4d4bc; background:#101a21; }
#mapCanvas .leaflet-container { height: 100%; width: 100%; background: #101a21; font: inherit; }
#mapCanvas .leaflet-control-attribution { font-size: 10px; }
#mapCanvas .leaflet-popup-content-wrapper,
#mapCanvas .leaflet-popup-tip { background: #101820; color: #e8edf1; }
#mapCanvas .leaflet-popup-content { margin: 12px 15px; }
#mapCanvas .leaflet-popup-content strong { color: #b4d4bc; }
.map-marker-pin {
    background: #1d3027;
    color: #b4d4bc;
    border: 1px solid #8fb89a;
    border-radius: 5px;
    padding: 5px 8px;
    white-space: nowrap;
    font: 700 11px "Segoe UI", Arial, sans-serif;
    box-shadow: 0 2px 8px #0008;
}
.map-marker-pin.team { background:#1b2936; border-color:#8ca9c7; color:#c5d7e8; }
.map-marker-pin.me { background:#253b2d; border-color:#b4d4bc; color:#fff; }
.map-controls-note { font-size: 11px; color: var(--muted); line-height: 1.5; }
.map-coordinates { font-size: 11px; color: var(--blue); overflow-wrap:anywhere; margin: 8px 0; }
@media (max-width: 650px) {
    #mapCanvas { height: 55vh; min-height: 320px; }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen">
    <div class="login-box">

        <div class="login-status">
            <span class="status-dot"></span>
            INTELLIGENCE OPERATIONS
        </div>

        <div class="login-logo">SPYing</div>
        <div class="login-subtitle">AGENT ACCESS PORTAL</div>

        <div class="divider"></div>

        <div id="loginForm">
            <div class="field">
                <label for="loginUsername">Agent ID or username</label>
                <input id="loginUsername" placeholder="Enter your agent ID"
                       autocomplete="username">
            </div>

            <div class="field">
                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password"
                       placeholder="Enter your password"
                       autocomplete="current-password">
            </div>

            <button class="primary" onclick="login()">
                AUTHENTICATE AGENT
            </button>

            <button class="login-switch" onclick="showRegister()">
                Create a new agent account
            </button>
        </div>
